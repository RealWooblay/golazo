[package]
name = "golazo-parimutuel"
version = "0.1.0"
description = "GOLAZO on-chain settlement: a pure parimutuel binary market."
edition = "2021"
license = "MIT"

[lib]
# `cdylib` is required to produce the SBF shared object the Solana runtime loads.
# `lib` lets the program's types be imported by integration tests / other crates.
crate-type = ["cdylib", "lib"]
name = "golazo_parimutuel"

[features]
# Standard Anchor feature flags.
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Integration-test only: swap USX_MINT for a committed local test mint we can
# mint freely (the real mainnet mint can't be recreated on a local validator).
# NEVER enable for a mainnet build.
local-mint = []
# Generates the IDL during build (Anchor 0.30 IDL build).
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# Modern Anchor (1.0.x) — ships current Agave platform-tools, so the build uses a
# recent cargo with no edition2024 dependency-resolution issues.
anchor-lang = "1.0.2"
# SPL token CPIs + account types. The protocol settles in the USX stablecoin
# (SPL classic), not native SOL — see USX_MINT in lib.rs.
anchor-spl = "1.0.2"
