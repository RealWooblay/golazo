<svg width="1242" height="2208" viewBox="0 0 1242 2208" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="1242" height="2208" fill="#0B0C0F"/>

  <!-- caption band -->
  <text x="621" y="150" text-anchor="middle" fill="#E8EDF2" font-size="78" font-weight="700" letter-spacing="1">Paid in seconds.</text>
  <text x="621" y="214" text-anchor="middle" fill="#8A93A0" font-size="34" font-weight="400" letter-spacing="3">WINNERS SPLIT THE POT</text>

  <!-- phone frame -->
  <rect x="171" y="290" width="900" height="1830" rx="84" fill="#14181E" stroke="#23262D" stroke-width="3"/>
  <rect x="195" y="314" width="852" height="1782" rx="62" fill="#0B0C0F"/>

  <defs>
    <clipPath id="po-screen"><rect x="195" y="314" width="852" height="1782" rx="62"/></clipPath>
  </defs>

  <g clip-path="url(#po-screen)">
    <!-- status bar -->
    <text x="245" y="382" fill="#E8EDF2" font-size="30" font-weight="600">9:41</text>
    <g fill="#E8EDF2">
      <rect x="905" y="362" width="30" height="22" rx="4"/>
      <rect x="945" y="357" width="34" height="27" rx="5"/>
      <rect x="989" y="360" width="46" height="24" rx="6" fill="none" stroke="#E8EDF2" stroke-width="3"/>
      <rect x="993" y="364" width="34" height="16" rx="3"/>
    </g>

    <!-- top app bar -->
    <g transform="translate(245,420)">
      <rect x="0" y="0" width="58" height="58" rx="16" fill="#14181E"/>
      <g transform="translate(7,7) scale(0.44)" stroke="#27E08A" stroke-width="7" stroke-linecap="round">
        <line x1="18" y1="38" x2="40" y2="38"/><line x1="13" y1="50" x2="38" y2="50"/><line x1="18" y1="62" x2="40" y2="62"/>
      </g>
      <circle cx="53.4" cy="36" r="8.4" fill="#27E08A"/>
      <polygon points="53.4,32 56.5,34.6 55.2,38.2 51.6,38.2 50.3,34.6" fill="#0B0C0F"/>
    </g>
    <text x="318" y="460" fill="#E8EDF2" font-size="34" font-weight="700" letter-spacing="2">GOLAZO</text>

    <!-- result eyebrow -->
    <text x="621" y="640" text-anchor="middle" fill="#27E08A" font-size="30" font-weight="700" letter-spacing="6">RESULT IN</text>

    <!-- the moment that hit -->
    <g transform="translate(245,690)">
      <rect x="0" y="0" width="752" height="92" rx="20" fill="#14181E" stroke="#23262D" stroke-width="2"/>
      <circle cx="50" cy="46" r="10" fill="#27E08A"/>
      <text x="80" y="40" fill="#8A93A0" font-size="24">Brazil shot on target</text>
      <text x="80" y="74" fill="#E8EDF2" font-size="30" font-weight="600">68' &#183; Vinicius Jr</text>
      <text x="712" y="58" text-anchor="end" fill="#27E08A" font-size="28" font-weight="700">YOU CALLED IT</text>
    </g>

    <!-- big multiplier ring -->
    <g transform="translate(621,1130)">
      <circle cx="0" cy="0" r="270" fill="#0E2A1C"/>
      <circle cx="0" cy="0" r="270" fill="none" stroke="#23262D" stroke-width="6"/>
      <!-- progress arc, mostly complete, flat stroke -->
      <circle cx="0" cy="0" r="270" fill="none" stroke="#27E08A" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="1470 1696" transform="rotate(-90)"/>
      <text x="0" y="-30" text-anchor="middle" fill="#8A93A0" font-size="34" letter-spacing="2">Multiplier</text>
      <text x="0" y="90" text-anchor="middle" fill="#27E08A" font-size="180" font-weight="700">1.85×</text>
    </g>

    <!-- You won -->
    <text x="621" y="1530" text-anchor="middle" fill="#E8EDF2" font-size="48" font-weight="600">You won</text>
    <text x="621" y="1660" text-anchor="middle" fill="#27E08A" font-size="150" font-weight="700">+$46.25</text>

    <!-- stake -> return breakdown -->
    <g transform="translate(245,1726)">
      <rect x="0" y="0" width="752" height="92" rx="20" fill="#14181E" stroke="#23262D" stroke-width="2"/>
      <text x="40" y="40" fill="#8A93A0" font-size="26">Stake</text>
      <text x="40" y="76" fill="#E8EDF2" font-size="32" font-weight="600">$25.00</text>
      <line x1="376" y1="22" x2="376" y2="70" stroke="#23262D" stroke-width="2"/>
      <text x="712" y="40" text-anchor="end" fill="#8A93A0" font-size="26">Returned</text>
      <text x="712" y="76" text-anchor="end" fill="#E8EDF2" font-size="32" font-weight="600">$71.25</text>
    </g>

    <!-- CTA -->
    <g transform="translate(245,1860)">
      <rect x="0" y="0" width="752" height="104" rx="24" fill="#27E08A"/>
      <text x="376" y="68" text-anchor="middle" fill="#0B0C0F" font-size="38" font-weight="700">Back to the match</text>
    </g>

    <!-- secondary line -->
    <text x="621" y="2030" text-anchor="middle" fill="#8A93A0" font-size="26">Cashed to your balance instantly</text>
  </g>

  <!-- notch -->
  <rect x="531" y="314" width="180" height="40" rx="20" fill="#0B0C0F"/>
</svg>
